name: AgileTest Sync

on:
  workflow_dispatch:
    inputs:
      TEST_EXECUTION_KEY:
        description: "Sub Test Execution Key có sẵn (bỏ trống để tự tạo mới dưới PARENT_KEY)"
        required: false
        type: string
      PARENT_KEY:
        description: "Key của issue cha (vd: PROJ-123). Bắt buộc nếu bỏ trống TEST_EXECUTION_KEY"
        required: false
        type: string
      PROJECT_KEY:
        description: "Project Key from Jira"
        required: false
        type: string

env:
  BASE_URL: ${{ vars.BASE_URL }}
  BASE_AUTH_URL: ${{ vars.BASE_AUTH_URL }}
  CLIENT_ID: ${{ secrets.CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
  PROJECT_KEY: ${{ inputs.PROJECT_KEY || vars.PROJECT_KEY }}
  PARENT_KEY: ${{ inputs.PARENT_KEY }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Parser chưa hỗ trợ parentId, nên tự tạo Sub Test Execution (Direct Execution) qua Jira API
      - name: Prepare Sub Test Execution
        id: prepare_execution
        env:
          INPUT_TEST_EXECUTION_KEY: ${{ inputs.TEST_EXECUTION_KEY }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DIRECT_EXECUTION_ISSUE_TYPE_ID: ${{ vars.DIRECT_EXECUTION_ISSUE_TYPE_ID }}
        run: |
          if [ -z "$PROJECT_KEY" ]; then
            echo "PROJECT_KEY is empty!"
            exit 1
          fi

          # Đã có key sẵn thì dùng luôn
          if [ -n "$INPUT_TEST_EXECUTION_KEY" ]; then
            echo "Dung Sub Test Execution co san: $INPUT_TEST_EXECUTION_KEY"
            echo "test_execution_key=$INPUT_TEST_EXECUTION_KEY" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$PARENT_KEY" ]; then
            echo "Phai truyen TEST_EXECUTION_KEY hoac PARENT_KEY!"
            exit 1
          fi

          if [ -z "$DIRECT_EXECUTION_ISSUE_TYPE_ID" ]; then
            echo "Chua cau hinh vars.DIRECT_EXECUTION_ISSUE_TYPE_ID!"
            exit 1
          fi

          BODY=$(jq -n \
            --arg project "$PROJECT_KEY" \
            --arg parent "$PARENT_KEY" \
            --arg issuetype "$DIRECT_EXECUTION_ISSUE_TYPE_ID" \
            --arg summary "Execution results - ${GITHUB_REPOSITORY} #${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            '{fields: {project: {key: $project}, parent: {key: $parent}, issuetype: {id: $issuetype}, summary: $summary}}')

          HTTP_CODE=$(curl -s -o create.json -w "%{http_code}" -X POST \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue" \
            --data "$BODY")

          echo "Create issue: HTTP $HTTP_CODE - $(cat create.json)"

          KEY=$(jq -r '.key // empty' create.json)
          if [ "$HTTP_CODE" -ge 400 ] || [ -z "$KEY" ]; then
            echo "Tao Sub Test Execution that bai!"
            exit 1
          fi

          echo "Da tao Sub Test Execution $KEY duoi $PARENT_KEY"
          echo "test_execution_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Execute Tests
        id: run_tests
        run: mvn test
        continue-on-error: true

      - name: Submit to AgileTest
        id: submit_agiletest
        if: always() && steps.prepare_execution.outputs.test_execution_key != ''
        env:
          TEST_EXECUTION_KEY: ${{ steps.prepare_execution.outputs.test_execution_key }}
        run: |
          TOKEN=$(curl -s -X POST "$BASE_AUTH_URL/api/apikeys/authenticate" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"$CLIENT_ID\",\"clientSecret\":\"$CLIENT_SECRET\"}" \
            | tr -d '"\n\r ')

          echo "::add-mask::$TOKEN"
          echo "TOKEN length: ${#TOKEN}"

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Token rong!"
            exit 1
          fi

          if [ ! -d "target/surefire-reports" ]; then
            echo "Directory target/surefire-reports does not exist."
            exit 1
          fi

          UPLOAD_FAILED=0
          FILE_FOUND=0

          while IFS= read -r -d '' FILE; do
            FILE_FOUND=1
            echo "Uploading: $FILE"

            HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
              "$BASE_URL/ds/test-executions/junit?projectKey=$PROJECT_KEY&testExecutionKey=$TEST_EXECUTION_KEY" \
              -H "Content-Type: application/xml" \
              -H "Authorization: JWT $TOKEN" \
              --data-binary "@$FILE")

            echo "HTTP $HTTP_CODE - $(cat response.json)"

            if [ "$HTTP_CODE" -ge 400 ] || grep -q '"error"' response.json; then
              echo "Upload FAILED for $FILE"
              UPLOAD_FAILED=1
            fi
          done < <(find target/surefire-reports -name "TEST-*.xml" -print0)

          if [ "$FILE_FOUND" -eq 0 ]; then
            echo "No JUnit XML files found in target/surefire-reports."
            exit 1
          fi

          if [ "$UPLOAD_FAILED" -eq 1 ]; then
            echo "One or more uploads failed."
            exit 1
          fi

          echo "All uploads successful."

      - name: Update Pipeline Status
        if: always() && steps.prepare_execution.outputs.test_execution_key != ''
        env:
          TEST_EXECUTION_KEY: ${{ steps.prepare_execution.outputs.test_execution_key }}
          UPLOAD_RESULT: ${{ steps.submit_agiletest.outcome }}
          TEST_RESULT: ${{ steps.run_tests.outcome }}
        run: |
          if [ "$UPLOAD_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ]; then
            RESULT="success"
          else
            RESULT="failed"
          fi

          echo "Test outcome: $TEST_RESULT"
          echo "Upload outcome: $UPLOAD_RESULT"
          echo "Pipeline result: $RESULT"

          TOKEN=$(curl -s -X POST "$BASE_AUTH_URL/api/apikeys/authenticate" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"$CLIENT_ID\",\"clientSecret\":\"$CLIENT_SECRET\"}" \
            | tr -d '"\n\r ')

          echo "::add-mask::$TOKEN"

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Token rong!"
            exit 1
          fi

          # Schema github yêu cầu bắt buộc: repository + runId (jobURL chỉ dành cho GitLab)
          BODY=$(jq -n \
            --arg tool "github" \
            --arg result "$RESULT" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$GITHUB_RUN_ID" \
            '{tool: $tool, result: $result, repository: $repository, runId: $runId}')

          echo "Pipeline body: $BODY"

          HTTP_CODE=$(curl -s -o pipeline.json -w "%{http_code}" -X POST \
            "$BASE_AUTH_URL/ds/test-executions/$TEST_EXECUTION_KEY/pipeline/histories?projectKey=$PROJECT_KEY" \
            -H "Content-Type: application/json" \
            -H "Authorization: JWT $TOKEN" \
            --data "$BODY")

          echo "Pipeline update: HTTP $HTTP_CODE - $(cat pipeline.json)"

          if [ "$HTTP_CODE" -ge 400 ] || grep -q '"error"' pipeline.json; then
            echo "Failed to update pipeline status."
            exit 1
          fi
